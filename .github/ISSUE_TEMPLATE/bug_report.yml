name: Bug report
description: Report an unexpected result from Token Saver
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not paste settings files, API keys, tokens or backup contents.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include what you expected and what Token Saver reported.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `/token-saver auditar`
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Token Saver and Claude Code versions
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, WSL, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Safe error output
      description: Remove paths, secrets and personal data before posting.
      render: text
