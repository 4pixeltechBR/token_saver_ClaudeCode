name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in the details below to help us understand and fix the issue.

  - type: input
    id: title
    attributes:
      label: Brief description
      placeholder: "Describe the bug in one sentence"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Detailed description of the bug"
      placeholder: "What happened? What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: "How can we reproduce this bug?"
      placeholder: |
        1. Run `/token-saver AUDIT`
        2. Check the output...
        3. See the error
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code Version
      placeholder: "e.g., Claude Code v1.2.3"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - WSL
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: "If applicable, include any error messages or logs"
      render: bash
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: "Any other information that might be helpful"
    validations:
      required: false
