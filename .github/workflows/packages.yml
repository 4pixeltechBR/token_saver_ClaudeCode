name: Packages
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test ./...
      - run: go vet ./...
      - run: python scripts/package.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: token-saver-2.0.0-packages
          path: dist/*
